[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "uresearch-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic-settings>=2.8",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.15",
  "python-multipart>=0.0.20",
  "boto3>=1.37",
  "redis>=5.2",
  "celery[redis]>=5.5",
  "pypdf>=5.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.11"]

[tool.ruff]
line-length = 100
target-version = "py311"
