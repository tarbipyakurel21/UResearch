services:
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://uresearch:uresearch@postgres:5432/uresearch
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
  worker:
    build: ./backend
    command: celery -A app.tasks.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg://uresearch:uresearch@postgres:5432/uresearch
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - postgres
    volumes:
      - ./backend:/app
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: uresearch
      POSTGRES_PASSWORD: uresearch
      POSTGRES_DB: uresearch
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data:
